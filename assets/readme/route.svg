<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-labelledby="rt rd">
  <title id="rt">The Offerstar workflow</title>
  <desc id="rd">Six steps in order: setup builds your profile, scan finds new jobs, plan ranks the best fits, apply tailors and checks a resume for your approval, track records every reply, and retro learns what gets calls.</desc>
  <style>
    .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
    .tw{fill:#E9ECFF;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
    .base{stroke:#3A4478;stroke-width:2;stroke-dasharray:2 9;stroke-linecap:round}
    .prog{stroke:#FFD66B;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:prog 9s linear infinite}
    @keyframes prog{0%,4.0%{stroke-dashoffset:1;opacity:1}69.0%,90%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
    .node{transform-box:fill-box;transform-origin:center;fill:#1A2150;stroke:#3A4478}
    .cap{fill:#7F89C8}
    @keyframes lit0{0%,4.0%{fill:#1A2150;stroke:#3A4478}6.0%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1.35)}9.0%,90%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1)}96%,100%{fill:#1A2150;stroke:#3A4478;transform:scale(1)}}
    @keyframes cap0{0%,4.0%{fill:#7F89C8}7.0%,90%{fill:#F4F1E8}96%,100%{fill:#7F89C8}}
    @keyframes lit1{0%,17.0%{fill:#1A2150;stroke:#3A4478}19.0%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1.35)}22.0%,90%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1)}96%,100%{fill:#1A2150;stroke:#3A4478;transform:scale(1)}}
    @keyframes cap1{0%,17.0%{fill:#7F89C8}20.0%,90%{fill:#F4F1E8}96%,100%{fill:#7F89C8}}
    @keyframes lit2{0%,30.0%{fill:#1A2150;stroke:#3A4478}32.0%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1.35)}35.0%,90%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1)}96%,100%{fill:#1A2150;stroke:#3A4478;transform:scale(1)}}
    @keyframes cap2{0%,30.0%{fill:#7F89C8}33.0%,90%{fill:#F4F1E8}96%,100%{fill:#7F89C8}}
    @keyframes lit3{0%,43.0%{fill:#1A2150;stroke:#3A4478}45.0%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1.35)}48.0%,90%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1)}96%,100%{fill:#1A2150;stroke:#3A4478;transform:scale(1)}}
    @keyframes cap3{0%,43.0%{fill:#7F89C8}46.0%,90%{fill:#F4F1E8}96%,100%{fill:#7F89C8}}
    @keyframes lit4{0%,56.0%{fill:#1A2150;stroke:#3A4478}58.0%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1.35)}61.0%,90%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1)}96%,100%{fill:#1A2150;stroke:#3A4478;transform:scale(1)}}
    @keyframes cap4{0%,56.0%{fill:#7F89C8}59.0%,90%{fill:#F4F1E8}96%,100%{fill:#7F89C8}}
    @keyframes lit5{0%,69.0%{fill:#1A2150;stroke:#3A4478}71.0%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1.35)}74.0%,90%{fill:#FFD66B;stroke:#FFE7A3;transform:scale(1)}96%,100%{fill:#1A2150;stroke:#3A4478;transform:scale(1)}}
    @keyframes cap5{0%,69.0%{fill:#7F89C8}72.0%,90%{fill:#F4F1E8}96%,100%{fill:#7F89C8}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.prog{stroke-dashoffset:0}.node{fill:#FFD66B;stroke:#FFE7A3}.cap{fill:#F4F1E8}}
  </style>
